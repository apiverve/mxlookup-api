openapi: 3.0.4
info:
  title: MX Lookup
  description: >-
    MX Lookup queries DNS to find MX records for any domain. It returns an array
    of mail exchange hostnames and their priority routing values in real time.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/mxlookup:
    get:
      summary: MX Lookup
      description: >-
        MX Lookup is a simple tool for getting MX records for a domain. It
        returns the MX records for the given domain.
      operationId: mxlookup
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          required: true
          description: The domain you want to get the MX records for (e.g. yahoo.com)
          example: yahoo.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  domain: yahoo.com
                  mx:
                    - priority: 1
                      exchange: mta6.am0.yahoodns.net
                      ips:
                        - 67.195.204.73
                        - 67.195.228.110
                        - 98.136.96.91
                        - 67.195.228.106
                        - 67.195.204.77
                        - 67.195.228.94
                        - 67.195.204.74
                        - 67.195.204.72
                      reverseDns: mtaproxy4.free.mail.vip.bf1.yahoo.com
                      reverseDnsConfirmed: true
                    - priority: 1
                      exchange: mta7.am0.yahoodns.net
                      ips:
                        - 67.195.204.72
                        - 98.136.96.74
                        - 67.195.204.74
                        - 98.136.96.91
                        - 67.195.204.73
                        - 98.136.96.76
                        - 67.195.228.110
                        - 67.195.228.94
                      reverseDns: mtaproxy3.free.mail.vip.bf1.yahoo.com
                      reverseDnsConfirmed: true
                    - priority: 1
                      exchange: mta5.am0.yahoodns.net
                      ips:
                        - 67.195.204.79
                        - 67.195.228.94
                        - 67.195.228.109
                        - 67.195.228.110
                        - 98.136.96.76
                        - 67.195.204.72
                        - 67.195.204.74
                        - 67.195.204.77
                      reverseDns: mtaproxy2.free.mail.vip.bf1.yahoo.com
                      reverseDnsConfirmed: true
                  acceptsMail: true
                  isNullMx: false
                  provider: Yahoo
                  isSecurityGateway: false
                  ttl: 503
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
